name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@5f6fc65856e23860445f42b0e3cff0ce74a91bee # v0.8.82

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@5f6fc65856e23860445f42b0e3cff0ce74a91bee # v0.8.82
        with:
          version: ${{ steps.version.outputs.version }}
