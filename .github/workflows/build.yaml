name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@660489c6d51eb13724f3a22144d320ea0636885a # v0.8.62

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@660489c6d51eb13724f3a22144d320ea0636885a # v0.8.62
        with:
          version: ${{ steps.version.outputs.version }}
