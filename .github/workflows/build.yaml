name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@70729f77b3573729e1f9dfddbd309ae26be8e55a # v0.8.51

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@70729f77b3573729e1f9dfddbd309ae26be8e55a # v0.8.51
        with:
          version: ${{ steps.version.outputs.version }}
