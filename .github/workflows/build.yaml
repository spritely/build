name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@f9ec9c472eb47300aa69129bf46ac831183fb94d # v0.8.42

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@f9ec9c472eb47300aa69129bf46ac831183fb94d # v0.8.42
        with:
          version: ${{ steps.version.outputs.version }}
