name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@25608348ad3ec9179138ffbdbfda5236056bc08b # v0.8.86

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@25608348ad3ec9179138ffbdbfda5236056bc08b # v0.8.86
        with:
          version: ${{ steps.version.outputs.version }}
