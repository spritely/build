name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write # To be able to apply semantic version tags to the repository

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@d2d17b0682f500153582dee5af5b313060bcaee6 # v0.8.36

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@d2d17b0682f500153582dee5af5b313060bcaee6 # v0.8.36
        with:
          version: ${{ steps.version.outputs.version }}
